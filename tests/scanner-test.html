<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Scanner tests</title></head>
<body>
<canvas id="out"></canvas>
<script src="../js/layout.js"></script>
<script src="../js/scanner.js"></script>
<script>
/* Synthetic end-to-end tests for the scanner: render a real sheet, "fill it in"
 * with pencil-like marks, photograph it (perspective, curl, lighting, blur,
 * noise, JPEG) and check the scanner reads back exactly what was marked. */
const L = MGLayout, S = MGScanner;

function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

async function svgToCanvas(svg, pxPerMm) {
  const W = Math.round(L.PAGE.w * pxPerMm), H = Math.round(L.PAGE.h * pxPerMm);
  const img = new Image();
  const sized = svg.replace(/width="[^"]*mm" height="[^"]*mm"/, `width="${W}" height="${H}"`);
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(sized);
  await img.decode();
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, W, H);
  return c;
}

function pencil(ctx, k, cx, cy, r, rand, strength) {
  ctx.save();
  const g = 40 + rand() * 50;
  ctx.fillStyle = `rgba(${g},${g},${g + 5},${strength})`;
  ctx.beginPath();
  ctx.ellipse((cx + (rand() - 0.5) * 0.7) * k, (cy + (rand() - 0.5) * 0.7) * k, r * (0.8 + rand() * 0.3) * k, r * (0.75 + rand() * 0.3) * k, rand() * 3, 0, Math.PI * 2);
  ctx.fill();
  // scribble texture
  ctx.strokeStyle = `rgba(${g},${g},${g},${strength * 0.6})`;
  ctx.lineWidth = 0.35 * k;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.moveTo((cx - r + rand() * r * 2) * k, (cy - r + rand() * 0.6) * k);
    ctx.lineTo((cx - r + rand() * r * 2) * k, (cy + r - rand() * 0.6) * k);
    ctx.stroke();
  }
  ctx.restore();
}

function invert3(m) {
  const [a, b, c, d, e, f, g, h, i] = m;
  const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;
  const det = a * A + b * B + c * C;
  return [A / det, -(b * i - c * h) / det, (b * f - c * e) / det, B / det, (a * i - c * g) / det, -(a * f - c * d) / det, C / det, -(a * h - b * g) / det, (a * e - b * d) / det];
}

/* Photograph the page canvas into an outW×outH image. */
function photograph(page, outW, outH, corners, rand, o) {
  const pctx = page.getContext("2d");
  const P = pctx.getImageData(0, 0, page.width, page.height);
  const src = [[0, 0], [page.width, 0], [page.width, page.height], [0, page.height]];
  const H = S.solveHomography(src, corners);
  const Hi = invert3(H);
  const out = new ImageData(outW, outH);
  const bow = o.bow || 0;
  for (let y = 0; y < outH; y++) for (let x = 0; x < outW; x++) {
    const z = Hi[6] * x + Hi[7] * y + Hi[8];
    let u = (Hi[0] * x + Hi[1] * y + Hi[2]) / z, v = (Hi[3] * x + Hi[4] * y + Hi[5]) / z;
    // paper curl: bulge the middle of the page
    u += bow * Math.sin(Math.PI * v / page.height) * Math.sin(Math.PI * u / page.width) * page.width / 215.9;
    v += bow * 0.6 * Math.sin(Math.PI * u / page.width) * page.width / 215.9;
    const j = (y * outW + x) * 4;
    let r, g, b;
    if (u >= 0 && v >= 0 && u < page.width - 1 && v < page.height - 1) {
      const i = ((v | 0) * page.width + (u | 0)) * 4;
      r = P.data[i]; g = P.data[i + 1]; b = P.data[i + 2];
    } else {
      // desk: dark wood-ish with stripes
      const t = 70 + 30 * Math.sin(x / 13 + y / 90) + 10 * Math.sin(y / 7);
      r = t * 1.1; g = t * 0.8; b = t * 0.55;
    }
    let light = o.light ? 1 - o.light * (x / outW) * (0.5 + 0.5 * y / outH) : 1;
    if (o.shadow && x + 0.4 * y < outW * o.shadow) light *= 0.55;
    const n = (rand() - 0.5) * 2 * (o.noise || 0);
    out.data[j] = r * light * (o.warm ? 1 : 0.97) + n;
    out.data[j + 1] = g * light * 0.98 + n;
    out.data[j + 2] = b * light * (o.warm ? 0.85 : 1) + n;
    out.data[j + 3] = 255;
  }
  const c = document.getElementById("out"); c.width = outW; c.height = outH;
  const ctx = c.getContext("2d");
  ctx.putImageData(out, 0, 0);
  if (o.blur) {
    const c2 = document.createElement("canvas"); c2.width = outW; c2.height = outH;
    const x2 = c2.getContext("2d"); x2.filter = `blur(${o.blur}px)`; x2.drawImage(c, 0, 0);
    ctx.drawImage(c2, 0, 0);
  }
  return c;
}

async function jpegRoundTrip(canvas, q) {
  const url = canvas.toDataURL("image/jpeg", q);
  const img = new Image(); img.src = url; await img.decode();
  const c = document.createElement("canvas"); c.width = canvas.width; c.height = canvas.height;
  c.getContext("2d").drawImage(img, 0, 0);
  return c;
}

async function runCase(cs) {
  const rand = rng(cs.seed);
  const test = { title: "Unit 4 Test", sections: cs.sections, versionCount: cs.versions || 1 };
  const testCode = 1 + Math.floor(rand() * 65000), sheetCode = 1 + Math.floor(rand() * 4000);
  const layout = L.computeLayout(test);
  const svg = L.renderSheetSVG(test, { testCode, sheetCode, studentName: "Alexandra Q. Student", className: "Algebra II — Period 3", date: "Nov 21, 2026" });
  const k = 6; // px per mm for the "paper"
  const page = await svgToCanvas(svg, k);
  const pctx = page.getContext("2d");
  const expected = [];
  for (const q of layout.questions) {
    const r = rand();
    let ans = "";
    if (r < 0.08) ans = "";
    else if (r < 0.12 && q.bubbles.length > 2) {
      const a = Math.floor(rand() * q.bubbles.length); let b = (a + 1 + Math.floor(rand() * (q.bubbles.length - 1))) % q.bubbles.length;
      ans = [q.bubbles[a].label, q.bubbles[b].label].sort().join("");
    } else ans = q.bubbles[Math.floor(rand() * q.bubbles.length)].label;
    for (const b of q.bubbles) if (ans.includes(b.label)) pencil(pctx, k, b.cx, b.cy, L.BUBBLE_R * 0.95, rand, (cs.pencil || 1) * (0.85 + rand() * 0.15));
    // erasure residue on a different bubble for some single answers
    if (ans.length === 1 && rand() < 0.1) {
      const other = q.bubbles.find((b) => b.label !== ans);
      pencil(pctx, k, other.cx, other.cy, L.BUBBLE_R * 0.9, rand, 0.12);
    }
    expected.push(ans);
  }
  let expectVersion = null;
  const vrow = layout.versionRow;
  if (vrow) {
    expectVersion = cs.versionBlank ? "" : vrow.bubbles[Math.floor(rand() * vrow.bubbles.length)].label;
    for (const b of vrow.bubbles) if (b.label === expectVersion) pencil(pctx, k, b.cx, b.cy, L.BUBBLE_R * 0.95, rand, 0.9);
  }
  const outW = cs.outW, outH = cs.outH;
  const pw = page.width, ph = page.height;
  // base placement: fit the page into the frame, then jitter corners
  const rot = cs.rotate || 0; // multiples of 90°
  const fill = cs.fill || 0.85;
  const landscape = rot % 2 === 1;
  const fw = landscape ? ph : pw, fh = landscape ? pw : ph;
  const s = Math.min(outW / fw, outH / fh) * fill;
  const cx = outW / 2 + (rand() - 0.5) * outW * 0.05, cy = outH / 2 + (rand() - 0.5) * outH * 0.05;
  let base = [[-pw / 2, -ph / 2], [pw / 2, -ph / 2], [pw / 2, ph / 2], [-pw / 2, ph / 2]];
  const ang = rot * Math.PI / 2 + (cs.tilt || 0) * Math.PI / 180;
  const corners = base.map(([x, y]) => {
    const xr = x * Math.cos(ang) - y * Math.sin(ang), yr = x * Math.sin(ang) + y * Math.cos(ang);
    const j = cs.persp || 0;
    return [cx + xr * s + (rand() - 0.5) * j * outW, cy + yr * s + (rand() - 0.5) * j * outH];
  });
  if (cs.noSheet) { pctx.fillStyle = "#6b4e33"; pctx.fillRect(0, 0, page.width, page.height); }
  let photo = photograph(page, outW, outH, corners, rand, cs);
  if (cs.jpeg) photo = await jpegRoundTrip(photo, cs.jpeg);
  const data = photo.getContext("2d").getImageData(0, 0, outW, outH);
  const res = S.scan(data, { getTest: (c) => (c === testCode ? test : null) });
  const out = { name: cs.name, status: res.status, ms: res.ms, expectFail: !!cs.expectFail };
  if (res.status !== "ok") { out.markers = res.markers.length; return out; }
  out.codeOk = res.testCode === testCode && res.sheetCode === sheetCode;
  const errs = [];
  if (vrow && res.version !== expectVersion) errs.push(`version: want "${expectVersion}" got "${res.version}"`);
  expected.forEach((e, i) => { if (res.responses[i] !== e) errs.push(`Q${i + 1}: want "${e}" got "${res.responses[i]}" d=${res.darkness[i].join(",")} flag=${res.flags[i]}`); });
  out.errors = errs;
  out.n = expected.length;
  out.flags = res.flags.filter(Boolean).length;
  out.stats = res.stats;
  return out;
}

const SECTIONS_A = [{ count: 5, type: "TF" }, { count: 5, type: "ASN" }, { count: 20, type: "AE" }];
const SECTIONS_B = [{ count: 10, type: "TF" }, { count: 10, type: "ASN" }, { count: 40, type: "AD" }, { count: 30, type: "AE" }];
const SECTIONS_C = [{ count: 12, type: "AF" }];

window.CASES = [
  { name: "clean upright 1080p", seed: 1, sections: SECTIONS_A, outW: 1920, outH: 1080, fill: 0.95 },
  { name: "phone photo 3000px tilt+persp", seed: 2, sections: SECTIONS_B, outW: 2250, outH: 3000, tilt: 6, persp: 0.04, light: 0.35, noise: 10, blur: 1, jpeg: 0.75 },
  { name: "upside down", seed: 3, sections: SECTIONS_A, outW: 2000, outH: 2600, rotate: 2, tilt: -4, persp: 0.03, noise: 6 },
  { name: "sideways landscape webcam 720p", seed: 4, sections: SECTIONS_A, outW: 1280, outH: 720, rotate: 1, tilt: 3, persp: 0.02, noise: 5, blur: 0.8, jpeg: 0.8, fill: 0.95 },
  { name: "webcam 1080p portrait-in-landscape", seed: 5, sections: SECTIONS_B, outW: 1920, outH: 1080, tilt: -8, persp: 0.03, light: 0.3, noise: 8, blur: 1, jpeg: 0.8, fill: 0.97 },
  { name: "paper curl 2.5mm", seed: 6, sections: SECTIONS_B, outW: 2400, outH: 3200, tilt: 2, bow: 2.5, persp: 0.02, noise: 6, jpeg: 0.85 },
  { name: "dim warm light", seed: 7, sections: SECTIONS_C, outW: 2000, outH: 2600, tilt: 10, light: 0.5, warm: true, noise: 12, blur: 1.2, jpeg: 0.7 },
  { name: "hard shadow across sheet", seed: 9, sections: SECTIONS_B, outW: 2250, outH: 3000, tilt: -3, persp: 0.03, shadow: 0.55, noise: 8, blur: 1, jpeg: 0.75 },
  { name: "light pencil", seed: 10, sections: SECTIONS_A, outW: 1920, outH: 1080, pencil: 0.55, tilt: 4, noise: 6, blur: 1, jpeg: 0.8, fill: 0.97 },
  { name: "paper curl 4mm", seed: 11, sections: SECTIONS_B, outW: 2400, outH: 3200, tilt: -5, bow: 4, persp: 0.03, noise: 6, jpeg: 0.8 },
  { name: "blurry 720p", seed: 12, sections: SECTIONS_A, outW: 1280, outH: 720, tilt: 2, blur: 1.8, noise: 8, jpeg: 0.6, fill: 0.97 },
  { name: "no sheet in view", seed: 13, sections: SECTIONS_A, outW: 1920, outH: 1080, noSheet: true, expectFail: true },
  { name: "versions A-D, phone photo", seed: 14, sections: SECTIONS_B, versions: 4, outW: 2250, outH: 3000, tilt: -5, persp: 0.03, noise: 8, blur: 1, jpeg: 0.8 },
  { name: "versions, webcam, version left blank", seed: 15, sections: SECTIONS_A, versions: 3, versionBlank: true, outW: 1920, outH: 1080, tilt: 3, noise: 6, jpeg: 0.8, fill: 0.97 },
  { name: "laptop webcam 720p, sheet held at arm's length", seed: 16, sections: SECTIONS_A, outW: 1280, outH: 720, fill: 0.62, tilt: 3, persp: 0.03, noise: 7, blur: 0.8, jpeg: 0.75, light: 0.25 },
  { name: "laptop webcam 720p, sheet farther away", seed: 17, sections: SECTIONS_B, outW: 1280, outH: 720, fill: 0.5, tilt: -4, noise: 6, blur: 0.6, jpeg: 0.8 },
  { name: "laptop webcam 720p, sheet held sideways", seed: 18, sections: SECTIONS_A, outW: 1280, outH: 720, fill: 0.75, rotate: 1, tilt: 2, noise: 6, blur: 0.7, jpeg: 0.8 },
  { name: "small in frame (far away)", seed: 8, sections: SECTIONS_A, outW: 1920, outH: 1080, fill: 0.6, tilt: 5, noise: 5 },
];

/* Used by the end-to-end test: fill in a printed sheet and photograph it. */
window.makePhoto = async function (svg, test, answers, cs) {
  const rand = rng(cs.seed || 1);
  const k = 6;
  const page = await svgToCanvas(svg, k);
  const pctx = page.getContext("2d");
  for (const q of L.computeLayout(test).questions) {
    const ans = answers[q.index] || "";
    for (const b of q.bubbles) if (ans.includes(b.label)) pencil(pctx, k, b.cx, b.cy, L.BUBBLE_R * 0.95, rand, 0.9);
  }
  const vrow = L.computeLayout(test).versionRow;
  if (vrow && cs.version) for (const b of vrow.bubbles) if (b.label === cs.version) pencil(pctx, k, b.cx, b.cy, L.BUBBLE_R * 0.95, rand, 0.9);
  if (cs.finger) {
    // Fingers holding the sheet: skin-coloured blobs in the left and right margins.
    for (const [cx, cy, rx, ry] of [[3, 150, 10, 17], [3, 185, 9, 15], [213, 120, 9, 15]]) {
      const g = pctx.createRadialGradient(cx * k, cy * k, 0, cx * k, cy * k, ry * k);
      g.addColorStop(0, "#d9a27e"); g.addColorStop(1, "#b97c5c");
      pctx.fillStyle = g;
      pctx.beginPath(); pctx.ellipse(cx * k, cy * k, rx * k, ry * k, 0, 0, Math.PI * 2); pctx.fill();
    }
  }
  const outW = cs.outW || 2250, outH = cs.outH || 3000;
  const pw = page.width, ph = page.height;
  const s = Math.min(outW / pw, outH / ph) * (cs.fill || 0.88);
  const ang = ((cs.rotate || 0) * 90 + (cs.tilt || 0)) * Math.PI / 180;
  const corners = [[-pw / 2, -ph / 2], [pw / 2, -ph / 2], [pw / 2, ph / 2], [-pw / 2, ph / 2]].map(([x, y]) => [
    outW / 2 + (x * Math.cos(ang) - y * Math.sin(ang)) * s + (rand() - 0.5) * 0.03 * outW,
    outH / 2 + (x * Math.sin(ang) + y * Math.cos(ang)) * s + (rand() - 0.5) * 0.03 * outH]);
  const photo = photograph(page, outW, outH, corners, rand, cs);
  return photo.toDataURL("image/jpeg", 0.8);
};

/* ---------- randomized stress test ----------
 * Many sheets with varied, realistic marking and photo conditions. Reports
 * every misread, split into flagged (the app asks the teacher to check it)
 * and silent (would go into the grade unnoticed). */

function markBubble(ctx, k, b, rand, style) {
  const R = L.BUBBLE_R;
  const dark = (a) => { const g = 30 + rand() * 50; return `rgba(${g},${g},${g + 5},${a})`; };
  ctx.save();
  if (style === "solid") pencil(ctx, k, b.cx, b.cy, R * 0.95, rand, 0.85 + rand() * 0.15);
  else if (style === "light") pencil(ctx, k, b.cx, b.cy, R * 0.95, rand, 0.4 + rand() * 0.2);
  else if (style === "partial") pencil(ctx, k, b.cx + (rand() - 0.5) * 0.8, b.cy + (rand() - 0.5) * 0.8, R * (0.55 + rand() * 0.2), rand, 0.85);
  else if (style === "offcenter") pencil(ctx, k, b.cx + (rand() - 0.5) * 2.2, b.cy + (rand() - 0.5) * 1.6, R * 0.9, rand, 0.85);
  else if (style === "pen") { ctx.fillStyle = dark(0.95); ctx.beginPath(); ctx.arc(b.cx * k, b.cy * k, R * (0.6 + rand() * 0.25) * k, 0, 7); ctx.fill(); }
  else if (style === "scribble") {
    ctx.strokeStyle = dark(0.8); ctx.lineWidth = (0.45 + rand() * 0.3) * k;
    ctx.beginPath();
    for (let i = 0; i < 9; i++) {
      const y = b.cy - R * 0.8 + (i * R * 1.6) / 8;
      ctx.lineTo((b.cx + (i % 2 ? 1 : -1) * R * (0.6 + rand() * 0.3)) * k, y * k);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function photographStress(page, outW, outH, corners, rand, o) {
  const c = photograph(page, outW, outH, corners, rand, o);
  const ctx = c.getContext("2d");
  if (o.motion) { // camera shake: average a few shifted copies
    const c2 = document.createElement("canvas"); c2.width = outW; c2.height = outH;
    const x2 = c2.getContext("2d"); x2.drawImage(c, 0, 0);
    ctx.globalAlpha = 0.35;
    for (let i = 1; i <= 3; i++) ctx.drawImage(c2, (o.motion * i) / 3 * Math.cos(o.motionAng), (o.motion * i) / 3 * Math.sin(o.motionAng));
    ctx.globalAlpha = 1;
  }
  if (o.glare) { // bright reflection somewhere on the sheet
    const [gx, gy, gr] = o.glare;
    const g = ctx.createRadialGradient(gx * outW, gy * outH, 0, gx * outW, gy * outH, gr * outW);
    g.addColorStop(0, "rgba(255,255,255,0.75)"); g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, outW, outH);
  }
  return c;
}

async function stressCase(seed) {
  const rand = rng(seed * 7919 + 13);
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];
  const between = (a, b) => a + rand() * (b - a);
  const sections = pick([
    [{ count: 10, type: "TF" }, { count: 20, type: "AE" }],
    [{ count: 10, type: "TF" }, { count: 4, type: "ASN" }, { count: 10, type: "AC" }, { count: 6, type: "AE" }],
    [{ count: 15, type: "AD" }, { count: 25, type: "AE" }, { count: 10, type: "TF" }],
    [{ count: 30, type: "AE" }, { count: 30, type: "AE" }, { count: 20, type: "AD" }],
  ]);
  const test = { title: "Stress", sections, versionCount: rand() < 0.3 ? 2 : 1 };
  const layout = L.computeLayout(test);
  const testCode = 1 + Math.floor(rand() * 65000), sheetCode = 1 + Math.floor(rand() * 4000);
  const svg = L.renderSheetSVG(test, { testCode, sheetCode, studentName: "Pat Example", className: "Period 1" });
  const k = 6;
  const page = await svgToCanvas(svg, k);
  const pctx = page.getContext("2d");
  const sheetStyle = pick(["solid", "solid", "solid", "light", "mixed", "mixed"]);
  const expected = [];
  for (const q of layout.questions) {
    const r = rand();
    let ans = "";
    if (r < 0.06) ans = "";
    else if (r < 0.09 && q.bubbles.length > 2) {
      const a = Math.floor(rand() * q.bubbles.length), b2 = (a + 1 + Math.floor(rand() * (q.bubbles.length - 1))) % q.bubbles.length;
      ans = [q.bubbles[a].label, q.bubbles[b2].label].sort().join("");
    } else ans = q.bubbles[Math.floor(rand() * q.bubbles.length)].label;
    const style = sheetStyle === "mixed" ? pick(["solid", "solid", "light", "partial", "offcenter", "pen", "scribble"]) : sheetStyle;
    for (const b of q.bubbles) if (ans.includes(b.label)) markBubble(pctx, k, b, rand, style);
    if (ans.length === 1 && rand() < 0.08) { // erasure residue on another bubble
      const other = q.bubbles.find((b) => b.label !== ans);
      pencil(pctx, k, other.cx, other.cy, L.BUBBLE_R * 0.9, rand, between(0.1, 0.25));
    }
    if (rand() < 0.04) { // stray pencil mark near the row
      pctx.strokeStyle = "rgba(60,60,60,0.7)"; pctx.lineWidth = 0.4 * k;
      const b = pick(q.bubbles), x = b.cx + between(-3, 3), y = q.cy + between(-3.3, 3.3);
      pctx.beginPath(); pctx.moveTo(x * k, y * k); pctx.lineTo((x + between(-3, 3)) * k, (y + between(-1, 1)) * k); pctx.stroke();
    }
    expected.push(ans);
  }
  if (layout.versionRow) markBubble(pctx, k, layout.versionRow.bubbles[0], rand, "solid");
  const size = pick([[1280, 720], [1920, 1080], [2250, 3000], [3024, 4032]]);
  const [outW, outH] = size;
  const rot = Math.floor(rand() * 4);
  const o = {
    noise: between(2, 12), blur: rand() < 0.6 ? between(0, 1.8) : 0, light: rand() < 0.5 ? between(0, 0.5) : 0,
    shadow: rand() < 0.15 ? between(0.3, 0.7) : 0, bow: rand() < 0.5 ? between(0, 4) : 0,
    motion: rand() < 0.2 ? between(1, 4) : 0, motionAng: rand() * 6.28,
    glare: rand() < 0.15 ? [between(0.3, 0.7), between(0.3, 0.7), between(0.05, 0.15)] : null,
  };
  const pw = page.width, ph = page.height;
  const landscape = rot % 2 === 1;
  const fill = outW < 2000 ? between(0.55, 0.97) : between(0.6, 0.92);
  const s = Math.min(outW / (landscape ? ph : pw), outH / (landscape ? pw : ph)) * fill;
  const ang = rot * Math.PI / 2 + between(-10, 10) * Math.PI / 180, persp = between(0, 0.05);
  const cx = outW / 2, cy = outH / 2;
  const corners = [[-pw / 2, -ph / 2], [pw / 2, -ph / 2], [pw / 2, ph / 2], [-pw / 2, ph / 2]].map(([x, y]) => [
    cx + (x * Math.cos(ang) - y * Math.sin(ang)) * s + (rand() - 0.5) * persp * outW,
    cy + (x * Math.sin(ang) + y * Math.cos(ang)) * s + (rand() - 0.5) * persp * outH]);
  let photo = photographStress(page, outW, outH, corners, rand, o);
  photo = await jpegRoundTrip(photo, between(0.55, 0.9));
  // The app shrinks big photos to 2600 px before scanning; do the same.
  let data;
  const kk = Math.min(1, 2600 / Math.max(outW, outH));
  if (kk < 1) {
    const c2 = document.createElement("canvas"); c2.width = Math.round(outW * kk); c2.height = Math.round(outH * kk);
    c2.getContext("2d").drawImage(photo, 0, 0, c2.width, c2.height);
    data = c2.getContext("2d").getImageData(0, 0, c2.width, c2.height);
  } else data = photo.getContext("2d").getImageData(0, 0, outW, outH);
  const res = S.scan(data, { getTest: (c) => (c === testCode ? test : null) });
  window.__dbg = { data, res, test };
  const params = { seed, size: size.join("x"), fill: +fill.toFixed(2), rot, style: sheetStyle, ...Object.fromEntries(Object.entries(o).filter(([, v]) => v).map(([kk2, v]) => [kk2, Array.isArray(v) ? v.map((x) => +x.toFixed(2)) : +(+v).toFixed(2)])) };
  if (res.status !== "ok") return { params, status: res.status, n: expected.length };
  const errs = [];
  expected.forEach((e, i) => {
    const got = res.responses[i];
    if (got === e) return;
    const flagged = !!res.flags[i] || got === "";
    errs.push({ q: i + 1, want: e, got, flag: res.flags[i] || (got === "" ? "blank" : null), silent: !flagged, d: res.darkness[i] });
  });
  // For debugging: where the corner squares really are in the scanned image.
  const Hg = S.solveHomography([[0, 0], [pw, 0], [pw, ph], [0, ph]], corners);
  const truth = ["tl", "tr", "br", "bl"].map((c) => S.project(Hg, L.FIDUCIALS[c][0] * k, L.FIDUCIALS[c][1] * k).map((v) => Math.round(v * kk)));
  return { params, status: "ok", n: expected.length, errs, stats: res.stats, ms: res.ms, offsets: res.offsets, corners: res.corners.map((p) => p.map(Math.round)), truth, nq: layout.questions.map((q) => q.col) };
}

window.runStress = async function (n, start) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(await stressCase((start || 1) + i));
  return out;
};

window.runTests = async function (only) {
  const results = [];
  for (const cs of window.CASES) {
    if (only && !cs.name.includes(only)) continue;
    results.push(await runCase(cs));
  }
  return results;
};
</script>
