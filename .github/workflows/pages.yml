name: Deploy to GitHub Pages

# Publishes the site (static HTML/CSS/JS at the repo root) to GitHub Pages.
# Two jobs, as in GitHub's own template: "build" uploads the site, then
# "deploy" publishes it. (Doing both in one job sometimes failed with
# "No artifacts named github-pages were found" because the deploy step looked
# for the upload before GitHub had registered it.)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Browsers may cache the scripts for a while; tagging their URLs with
      # this commit makes every deploy load fresh copies.
      - name: Stamp script and stylesheet URLs with this version
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"(js/[^\"?]+\.js|styles\.css)\"#\1=\"\2?v=$v\"#g" index.html
          grep -c "?v=$v" index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
